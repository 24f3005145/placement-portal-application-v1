<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/student/edit_profile.css') }}">
</head>

<body>
    <div class="profile-card">
        <h2>Edit Profile</h2>

    <form method="POST">

        <label>Name:</label><br>
        <input type="text" name="name" value="{{ student.name }}" required><br><br>

        <label>Email:</label><br>
        <input type="email" name="email" value="{{ student.email }}" required><br><br>

        <label>Department:</label><br>
        <input type="text" name="department" value="{{ student.department }}" required><br><br>

        <label>Education:</label><br>
        <input type="text" name="education" value="{{ student.education }}" required><br><br>

        <label>Skills:</label><br>
        <input type="text" name="skills" value="{{ student.skills }}" required><br><br>

        <label>Contact:</label><br>
        <input type="text" name="contact" value="{{ student.contact }}" required><br><br>



        <button type="submit">Update Profile</button>
    </form>

    <br><br>

    <a href="{{ url_for('student.student_dashboard') }}">
        <button>⬅ Go Back</button>
    </a>
    </div>

</body>

</html>
